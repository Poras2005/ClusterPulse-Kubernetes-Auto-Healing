replicaCount: 1

image:
  repository: clusterpulse-controller
  pullPolicy: IfNotPresent
  tag: "latest"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi

kubernetes:
  namespace: default
  watch_interval_seconds: 15

healers:
  memory_leak:
    enabled: true
    threshold_percent: 80
    trend_window_minutes: 5
    slope_threshold_percent_per_min: 5
    cooldown_minutes: 10

serviceAccount:
  create: true
  name: ""
