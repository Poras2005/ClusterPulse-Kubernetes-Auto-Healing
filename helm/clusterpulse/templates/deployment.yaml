apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "clusterpulse.fullname" . }}
  labels:
    {{- include "clusterpulse.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "clusterpulse.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "clusterpulse.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "clusterpulse.serviceAccountName" . }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
      volumes:
        - name: config
          configMap:
            name: {{ include "clusterpulse.fullname" . }}-config
