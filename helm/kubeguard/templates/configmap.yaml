apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kubeguard.fullname" . }}-config
data:
  config.yaml: |
    kubernetes:
      namespace: {{ .Values.kubernetes.namespace }}
      watch_interval_seconds: {{ .Values.kubernetes.watch_interval_seconds }}
    healers:
      memory_leak:
        enabled: {{ .Values.healers.memory_leak.enabled }}
        threshold_mb: {{ .Values.healers.memory_leak.threshold_mb }}
        trend_window_minutes: {{ .Values.healers.memory_leak.trend_window_minutes }}
        slope_threshold_mb_per_min: {{ .Values.healers.memory_leak.slope_threshold_mb_per_min }}
        cooldown_minutes: {{ .Values.healers.memory_leak.cooldown_minutes }}
    alerts:
      slack_webhook: {{ .Values.alerts.slackWebhook | quote }}
      sns_topic_arn: {{ .Values.alerts.snsTopicArn | quote }}
    audit:
      dynamodb_table: {{ .Values.audit.dynamodbTable }}
      aws_region: {{ .Values.audit.awsRegion }}
