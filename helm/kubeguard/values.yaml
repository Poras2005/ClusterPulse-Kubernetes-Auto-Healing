replicaCount: 1

image:
  repository: kubeguard-controller
  pullPolicy: IfNotPresent
  tag: "latest"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi

kubernetes:
  namespace: default
  watch_interval_seconds: 15

healers:
  memory_leak:
    enabled: true
    threshold_mb: 800
    trend_window_minutes: 5
    slope_threshold_mb_per_min: 20
    cooldown_minutes: 10

alerts:
  secretName: "kubeguard-alerts"
  snsTopicArn: ""  # Set via --set alerts.snsTopicArn

audit:
  dynamodbTable: kubeguard-events
  awsRegion: ap-south-1

aws:
  secretName: "kubeguard-aws-creds"

serviceAccount:
  create: true
  name: ""
