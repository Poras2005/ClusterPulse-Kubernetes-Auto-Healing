name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8
        
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 controller/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings
        flake8 controller/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        
    - name: Run tests
      run: |
        pytest tests/

  build-and-validate:
    needs: test-and-lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Start Minikube
      uses: medyagh/setup-minikube@latest
      
    - name: Build Docker image in Minikube
      run: |
        # Point docker CLI to Minikube's docker daemon
        eval $(minikube docker-env)
        docker build -t clusterpulse-controller:latest -f controller/Dockerfile .
        
    - name: Validate on Minikube
      run: |
        # Verify the cluster is running
        kubectl get nodes
        
        # Here you would typically apply your K8s manifests
        # For example: 
        # kubectl apply -f k8s/
        # kubectl wait --for=condition=available deployment/clusterpulse-controller --timeout=60s
        
        echo "Minikube validation step completed successfully."
