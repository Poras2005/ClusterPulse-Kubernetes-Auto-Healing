# config.yaml — non-sensitive settings only

kubernetes:
  namespace: default # namespace to watch
  watch_interval_seconds: 15 # how often healers run
  prometheus_url: 'http://prometheus-server.monitoring.svc.cluster.local:80'

healers:
  memory_leak:
    enabled: true
    threshold_percent: 80 # start watching above this percent
    trend_window_minutes: 5 # measure slope over this window
    slope_threshold_percent_per_min: 5 # percent/min rise = leak
    cooldown_minutes: 10 # don't re-heal same pod for 10 min
